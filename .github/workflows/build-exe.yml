name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install   # 改成 npm install（不再要求 lock 文件）

      - name: Build Vite + Electron
        run: npm run build:app   # 使用你项目自带的打包命令

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SEO-Pipeline-Windows-EXE
          path: |
            release/*.exe
            release/*.blockmap
